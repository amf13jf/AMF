<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Almoço Voando</title>
<style>
  :root {
    --bg: #F4EFE6;
    --ink: #1B1B1F;
    --accent: #FF5A36;
    --accent-ink: #FFFFFF;
    --soft: #E6DDCC;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
  body { font-family: "Inter Display", "Inter", sans-serif; color: var(--ink); }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }

  .blob { position: absolute; border-radius: 50%; background: var(--soft); filter: blur(2px); }

  #clock { position: absolute; left: 50%; top: 520px; width: 220px; height: 220px; margin-left: -110px; }
  #clock .face { position: absolute; inset: 0; border-radius: 50%; border: 14px solid var(--ink); background: var(--bg); }
  #clock .hand { position: absolute; left: 50%; bottom: 50%; background: var(--ink); border-radius: 8px; transform-origin: 50% 100%; }
  #clock .h { width: 14px; height: 52px; margin-left: -7px; }
  #clock .m { width: 10px; height: 78px; margin-left: -5px; background: var(--accent); }
  #clock .dot { position: absolute; left: 50%; top: 50%; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%; background: var(--ink); }

  #text { position: absolute; left: 90px; right: 90px; top: 830px; font-weight: 800; font-size: 118px; line-height: 1.04; letter-spacing: -4px; }
  .line { display: block; overflow: hidden; padding: 6px 0 14px; }
  .word { display: inline-block; will-change: transform; }
  .gap { display: inline-block; width: 28px; }

  #pill { position: relative; display: inline-block; }
  #pill .bg { position: absolute; left: -22px; right: -22px; top: 4px; bottom: -4px; background: var(--accent); border-radius: 999px; transform-origin: 0 50%; }
  #pill .word { position: relative; color: var(--accent-ink); }

  #plane { position: absolute; left: 0; top: 0; width: 120px; height: 120px; }
  #trail { position: absolute; inset: 0; }
</style>
</head>
<body>
<div id="stage">
  <div class="blob" id="b1" style="width:700px;height:700px;left:-260px;top:-200px"></div>
  <div class="blob" id="b2" style="width:560px;height:560px;right:-220px;bottom:-160px"></div>

  <svg id="trail" width="1080" height="1920" viewBox="0 0 1080 1920">
    <path id="trailPath" d="M -80 1560 C 260 1500, 420 1720, 620 1540 S 980 1300, 1180 1360"
          fill="none" stroke="#1B1B1F" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 22" />
  </svg>
  <svg id="plane" viewBox="0 0 24 24">
    <path d="M2 11.5 22 3l-6.5 18-3.8-7.2L2 11.5Z" fill="#FF5A36" stroke="#1B1B1F" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M11.7 13.8 22 3" stroke="#1B1B1F" stroke-width="1.2" stroke-linecap="round"/>
  </svg>

  <div id="clock">
    <div class="face"></div>
    <div class="hand h" id="hh"></div>
    <div class="hand m" id="mh"></div>
    <div class="dot"></div>
  </div>

  <div id="text">
    <span class="line"><span class="word">Seu</span><span class="gap"></span><span class="word">horário</span></span>
    <span class="line"><span class="word">de</span><span class="gap"></span><span class="word">almoço</span></span>
    <span class="line"><span class="word">passa</span></span>
    <span class="line" style="overflow:visible"><span id="pill"><span class="bg"></span><span class="word">voando?</span></span></span>
  </div>
</div>

<script>
  const DURATION = 5;
  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  const prog = (t, s, d) => clamp((t - s) / d);
  const easeOutExpo = x => (x === 1 ? 1 : 1 - Math.pow(2, -10 * x));
  const easeInOutCubic = x => (x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const easeOutBack = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
  const easeInBack = x => { const c1 = 1.70158, c3 = c1 + 1; return c3 * x * x * x - c1 * x * x; };

  const $ = s => document.querySelector(s);
  const words = [...document.querySelectorAll('#text .line .word')];
  const pathEl = $('#trailPath');
  const pathLen = pathEl.getTotalLength();

  window.render = function (t) {
    // Saída final: tudo sobe e some (4.45s → 5s)
    const out = easeInBack(prog(t, 4.45, 0.5));

    // Blobs respirando
    $('#b1').style.transform = `translate(${Math.sin(t * 1.2) * 30}px, ${Math.cos(t) * 24}px) scale(${1 + 0.04 * Math.sin(t * 1.6)})`;
    $('#b2').style.transform = `translate(${Math.cos(t * 1.1) * 26}px, ${Math.sin(t * 1.3) * 30}px)`;

    // Relógio: entra com pop, ponteiros giram cada vez mais rápido
    const cIn = easeOutBack(prog(t, 0.0, 0.55));
    const spin = Math.pow(prog(t, 0.2, 4.2), 1.8) * 360 * 9;
    $('#clock').style.transform = `translateY(${-out * 260}px) scale(${cIn * (1 - out)}) rotate(${(1 - cIn) * -40}deg)`;
    $('#mh').style.transform = `rotate(${spin}deg)`;
    $('#hh').style.transform = `rotate(${60 + spin / 12}deg)`;

    // Palavras: slide-up mascarado + blur, em cascata
    const starts = [0.35, 0.5, 0.75, 0.9, 1.2, 1.55];
    words.forEach((w, i) => {
      if (i === 5) return; // "voando?" tratado no pill
      const p = easeOutExpo(prog(t, starts[i], 0.7));
      const blur = (1 - p) * 14;
      w.style.transform = `translateY(${(1 - p) * 140 - out * 300}px)`;
      w.style.filter = `blur(${blur}px)`;
      w.style.opacity = (p > 0 ? 1 : 0) * (1 - out);
    });

    // Pill "voando?": barra laranja expande, palavra entra com overshoot e flutua
    const bgP = easeOutExpo(prog(t, 1.55, 0.6));
    const vw = words[5];
    const vP = easeOutBack(prog(t, 1.75, 0.55));
    const floatY = Math.sin((t - 2.2) * 4) * 8 * prog(t, 2.2, 0.4);
    $('#pill .bg').style.transform = `scaleX(${bgP})`;
    $('#pill').style.transform = `translateY(${floatY - out * 320}px) rotate(${-3 * prog(t, 2.0, 0.5)}deg)`;
    $('#pill').style.opacity = 1 - out;
    vw.style.transform = `translateY(${(1 - vP) * 80}px) scale(${0.6 + 0.4 * vP})`;
    vw.style.opacity = t >= 1.75 ? 1 : 0;

    // Aviãozinho cruza a tela seguindo a trilha tracejada
    const fp = easeInOutCubic(prog(t, 2.0, 2.3));
    const len = fp * pathLen;
    const pt = pathEl.getPointAtLength(len);
    const pt2 = pathEl.getPointAtLength(Math.min(pathLen, len + 2));
    const ang = Math.atan2(pt2.y - pt.y, pt2.x - pt.x) * 180 / Math.PI;
    $('#plane').style.transform = `translate(${pt.x - 60}px, ${pt.y - 60}px) rotate(${ang + 22}deg)`;
    $('#plane').style.opacity = fp > 0 && fp < 1 ? 1 : 0;
    pathEl.style.strokeDashoffset = 0;
    pathEl.setAttribute('stroke-dasharray', `2 22`);
    // Revela a trilha só atrás do avião, depois apaga
    const trailFade = 1 - prog(t, 4.0, 0.5);
    $('#trail').style.clipPath = `inset(0 ${1080 - pt.x}px 0 0)`;
    $('#trail').style.opacity = (fp > 0 ? 0.35 : 0) * trailFade;
  };

  // Preview no navegador: toca em loop
  if (!navigator.webdriver) {
    const t0 = performance.now();
    const loop = now => { render(((now - t0) / 1000) % DURATION); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  } else {
    render(0);
  }
</script>
</body>
</html>
