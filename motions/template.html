<!doctype html>
<html><head><meta charset="utf-8">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1080px;height:1920px;overflow:hidden;font-family:Inter,sans-serif}
  body.bg{background:linear-gradient(165deg,#4a51c4 0%,#313782 50%,#1a1d4f 100%)}
  body.alpha{background:transparent}
  .blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.45}
  body.alpha .blob, body.alpha .deco{display:none}
  #stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
  #card{width:880px;border-radius:56px;background:#fff;box-shadow:0 40px 90px rgba(40,0,60,.35);overflow:hidden;transform-origin:50% 60%}
  .head{background:linear-gradient(90deg,#262b6e,#313782,#4a51c4);padding:54px 60px 46px;display:flex;flex-direction:column;align-items:center;gap:18px;position:relative}
  .avatar{width:340px;height:128px;border-radius:64px;background:#fff;display:flex;align-items:center;justify-content:center;position:absolute;top:0;left:50%;margin-left:-170px;box-shadow:0 10px 30px rgba(60,0,80,.25);z-index:2}
  .label{color:#fff;font-weight:700;font-size:44px;letter-spacing:.5px;margin-top:40px}
  .body{padding:70px 70px 60px;min-height:420px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:50px}
  #q{font-weight:800;font-size:76px;line-height:1.12;color:#1a1a1a;text-align:center;letter-spacing:-1.5px;min-height:170px;display:flex;align-items:center;justify-content:center}
  #cursor{display:inline-block;width:6px;height:72px;background:#313782;margin-left:6px;vertical-align:-8px;border-radius:3px}
  .reply{background:#f1f1f4;color:#9a9aa5;font-size:36px;font-weight:600;padding:26px 60px;border-radius:999px;width:100%;text-align:center}
  #wrap{position:relative;padding-top:64px}
  .top{position:absolute;top:250px;width:100%;text-align:center;color:#fff;font-weight:800;font-size:56px;letter-spacing:-1px;white-space:nowrap;text-shadow:0 6px 24px rgba(0,0,0,.18)}
  .deco{position:absolute;font-size:110px}
  #top.deco{font-size:60px}
  #handle.deco{font-size:44px}
  #tap{position:absolute;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.9);box-shadow:0 0 0 0 rgba(255,255,255,.6);pointer-events:none}
</style></head>
<body class="bg">
<div class="blob" style="width:700px;height:700px;background:#6f8cff;left:-250px;top:-150px"></div>
<div class="blob" style="width:800px;height:800px;background:#7fd0ff;right:-300px;bottom:-200px"></div>
<div class="top deco" id="top">Vocês perguntaram 💬</div>
<div class="deco" id="handle" style="left:0;width:100%;top:1700px;text-align:center;color:#fff;font-weight:700;font-size:44px;opacity:.85">@meiaspolo</div>
<div class="deco" id="d1" style="left:80px;top:1420px">🧦</div>
<div class="deco" id="d2" style="right:70px;top:380px">🧦</div>
<div id="stage"><div id="wrap"><div id="card">
  <div class="head"><div class="label">Caixinha de perguntas</div></div>
  <div class="body"><div id="q"><span><span id="txt"></span><span id="cursor"></span></span></div><div class="reply" id="reply">Toque para responder</div></div>
</div><div class="avatar" id="av"><img src="logo.png" style="height:92px"></div></div></div>
<script>
const P = new URLSearchParams(location.search);
const Q = P.get('q') || 'Pergunta?';
if (P.get('alpha')==='1') document.body.className='alpha';
const $=id=>document.getElementById(id);
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const easeOutBack=x=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const easeOut=x=>1-Math.pow(1-x,3);
// pre-size question area with full text so card doesn't jump
$('txt').textContent=Q; const h=$('q').offsetHeight; $('q').style.height=h+'px';
window.render=function(t){
  // card pop-in 0–0.7s
  const p=clamp(t/0.7), s=0.5+0.5*easeOutBack(p);
  const fl=Math.sin(Math.max(0,t-0.7)*2.2)*8;
  $('wrap').style.transform=`translateY(${(1-easeOut(p))*160+fl}px) scale(${s}) rotate(${(1-easeOut(p))*-6}deg)`;
  $('wrap').style.opacity=clamp(t/0.25);
  // avatar bounce
  const ap=clamp((t-0.35)/0.5);
  $('av').style.transform=`scale(${easeOutBack(ap)})`;
  // typing 0.9s → ~0.9+len*0.045
  const per=0.045, start=0.9, n=Math.floor(clamp((t-start)/per,0,Q.length));
  $('txt').textContent=Q.slice(0,n);
  const done=start+Q.length*per;
  $('cursor').style.opacity = t<done ? 1 : ((Math.floor((t-done)/0.45)%2)?0:1);
  // reply pill pulse after typing
  const rp=clamp((t-done-0.3)/0.4);
  const pulse=1+0.03*Math.sin(Math.max(0,t-done-0.7)*6)*rp;
  $('reply').style.transform=`scale(${pulse})`;
  $('reply').style.background=`rgb(${241-rp*192},${241-rp*186},${244-rp*114})`;
  $('reply').style.color= rp>0.5?'#fff':'#9a9aa5';
  // top title + socks
  const tp=easeOut(clamp((t-0.2)/0.6));
  $('top').style.opacity=tp; $('top').style.transform=`translateY(${(1-tp)*-40}px)`;
  $('d1').style.transform=`translateY(${Math.sin(t*1.8)*20}px) rotate(${-15+Math.sin(t*1.3)*10}deg) scale(${easeOutBack(clamp((t-0.5)/0.5))})`;
  $('handle').style.opacity=.85*easeOut(clamp((t-1)/0.6));
  $('d2').style.transform=`translateY(${Math.cos(t*1.6)*20}px) rotate(${20+Math.cos(t*1.2)*10}deg) scale(${easeOutBack(clamp((t-0.7)/0.5))})`;
};
render(0);
</script></body></html>
