<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Placa Top Quality A4</title>
<style>
@page { size: A4 landscape; margin: 0; }
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:297mm;height:210mm;background:#14185a}
body{font-family:"Inter","Inter Display",sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.page{position:relative;width:297mm;height:210mm;overflow:hidden;color:#fff;
  background:radial-gradient(90% 110% at 30% 50%,#3a3fb8 0%,#272c96 40%,#181c66 80%,#10134a 100%)}
.page::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.025) 0 2mm,transparent 2mm 6mm)}
.corner{position:absolute;border-radius:50%;border:2.2mm solid #f7941d}
.corner.tl{top:-40mm;left:-40mm;width:80mm;height:80mm}
.corner.tr{bottom:-60mm;right:-45mm;width:110mm;height:110mm;border-width:1.2mm;opacity:.4}
.strip{position:absolute;left:0;right:0;bottom:0;height:4.5mm;background:linear-gradient(90deg,#f7941d,#ffb35c,#f7941d)}
/* left: logo seal */
.stage{position:absolute;left:20mm;top:50%;transform:translateY(-50%);width:140mm;height:140mm}
.seal{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;box-shadow:0 0 0 2mm rgba(255,255,255,.1),0 8mm 18mm rgba(0,0,0,.4)}
.glow{position:absolute;inset:-12mm;border-radius:50%;background:radial-gradient(circle,rgba(247,148,29,.28),rgba(247,148,29,0) 65%)}
.ring{position:absolute;inset:0;border-radius:50%;background:#2e3192;border:4.5mm solid #f7941d;
  box-shadow:0 0 0 1.6mm rgba(255,255,255,.12),0 6mm 16mm rgba(0,0,0,.35)}
.ring2{position:absolute;inset:9mm;border-radius:50%;border:.5mm dashed rgba(255,255,255,.35)}
.logo{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:108mm;display:block}
.stars{position:absolute;left:50%;bottom:-13mm;transform:translateX(-50%);display:flex;gap:2.2mm}
.stars svg{width:6mm;height:6mm}
/* right column */
.right{position:absolute;left:172mm;right:16mm;top:0;bottom:4.5mm;display:flex;flex-direction:column;justify-content:center}
.kicker{display:flex;align-items:center;gap:3mm;font-weight:600;font-size:3.8mm;letter-spacing:1.4mm;color:#ffb35c;text-transform:uppercase}
.kicker i{display:block;width:12mm;height:.6mm;background:#f7941d;border-radius:1mm}
h1{margin-top:4mm;font-family:"Inter Display","Inter";font-weight:900;font-size:15mm;line-height:.98;letter-spacing:-.3mm;text-transform:uppercase}
h1 span{color:#f7941d}
.sub{margin-top:5mm;font-size:4.2mm;line-height:1.45;color:rgba(255,255,255,.82);max-width:100mm}
.sub b{color:#fff}
.lower{margin-top:10mm;display:flex;gap:5mm;align-items:stretch}
.contacts{flex:1;min-width:0;display:flex;flex-direction:column;gap:4mm;justify-content:center}
.card{display:flex;align-items:center;gap:3mm;background:#232874;border:.4mm solid rgba(255,255,255,.18);border-radius:4mm;padding:3.5mm}
.ic{flex:0 0 10mm;height:10mm;border-radius:50%;background:#f7941d;display:flex;align-items:center;justify-content:center}
.ic svg{width:6mm;height:6mm}
.lbl{font-size:2.6mm;font-weight:600;letter-spacing:.6mm;text-transform:uppercase;color:#ffb35c}
.val{font-weight:800;font-size:5.6mm;letter-spacing:-.2mm;white-space:nowrap}
.val small{font-size:3.6mm;font-weight:700;margin-right:1mm;opacity:.85}
.val.ig{font-size:4.1mm}
.qr{flex:0 0 40mm;background:#fff;border-radius:4mm;padding:3mm;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.5mm;border:1.2mm solid #f7941d}
.qr img{display:block;width:31mm;height:31mm}
.qrtxt{color:#14185a;text-align:center;font-size:2.7mm;line-height:1.25;font-weight:500}
.qrtxt b{font-weight:800;color:#e07f0c;text-transform:uppercase;letter-spacing:.3mm}
</style></head><body>
<div class="page">
  <div class="corner tl"></div><div class="corner tr"></div>
  <div class="stage">
    <div class="glow"></div>
    <img class="seal" src="logo-redondo.png" alt="Top Quality">
    <div class="stars">
      <svg viewBox="0 0 24 24"><path fill="#f7941d" d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7L12 17.3 5.8 21l1.6-7L2 9.2l7.1-.6z"/></svg>
      <svg viewBox="0 0 24 24"><path fill="#f7941d" d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7L12 17.3 5.8 21l1.6-7L2 9.2l7.1-.6z"/></svg>
      <svg viewBox="0 0 24 24"><path fill="#f7941d" d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7L12 17.3 5.8 21l1.6-7L2 9.2l7.1-.6z"/></svg>
      <svg viewBox="0 0 24 24"><path fill="#f7941d" d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7L12 17.3 5.8 21l1.6-7L2 9.2l7.1-.6z"/></svg>
      <svg viewBox="0 0 24 24"><path fill="#f7941d" d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7L12 17.3 5.8 21l1.6-7L2 9.2l7.1-.6z"/></svg>
    </div>
  </div>
  <div class="right">
    <div class="kicker"><i></i>Consultoria</div>
    <h1>Aqui tem<br><span>qualidade!</span></h1>
    <p class="sub">Consultoria com <b>eficiência</b> e <b>qualidade</b> para o seu negócio. Fale com a gente!</p>
    <div class="lower">
      <div class="contacts">
        <div class="card">
          <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 20.5l1.3-4.1A8.5 8.5 0 1 1 8 19.4z"/><path d="M9 8.5c0 3.3 3.2 6.5 6.5 6.5l1-1.6-2-1-1 .8c-1-.4-2.2-1.6-2.6-2.6l.8-1-1-2z" fill="#fff" stroke-width="1"/></svg></div>
          <div><div class="lbl">WhatsApp</div><div class="val"><small>(32)</small>98439-1843</div></div>
        </div>
        <div class="card">
          <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.3" cy="6.7" r="1" fill="#fff" stroke="none"/></svg></div>
          <div><div class="lbl">Instagram</div><div class="val ig">@topqualityconsultoria</div></div>
        </div>
      </div>
      <div class="qr">
        <img src="qr-whatsapp.svg" alt="QR Code WhatsApp">
        <div class="qrtxt">Aponte a câmera<br><b>e fale conosco</b></div>
      </div>
    </div>
  </div>
  <div class="strip"></div>
</div>
</body></html>
